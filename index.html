<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLV Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1818; --panel:#221f1f; --panel-2:#262222;
    --line:rgba(189,187,176,.12); --line-strong:rgba(189,187,176,.22);
    --grape:#654597; --lav:#AB81CD; --mauve:#E2ADF2; --silver:#BDBBB0; --olive:#8A897C;
    --amber:#D9A441; --ready:#AB81CD; --green:#6FB36A; --grey:#5c5a52;
    --txt:#E8E6DE; --txt-mute:#9A988C; --err:#cf7d7d;
    font-size:15px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
    background-image:radial-gradient(circle at 18% -10%,rgba(101,69,151,.10),transparent 55%),radial-gradient(circle at 100% 0%,rgba(171,129,205,.06),transparent 45%);background-attachment:fixed;}
  .label{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--olive)}
  .mono{font-family:'DM Mono',monospace}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.02em}
  button{cursor:pointer;font-family:inherit}
  input,textarea,select{font-family:inherit}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:24px;padding:14px 26px;background:rgba(26,24,24,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .mark{width:32px;height:32px;border-radius:7px;background:linear-gradient(150deg,var(--grape),var(--lav));display:grid;place-items:center;flex:none}
  .brand .mark svg{width:18px;height:18px;stroke:#1a1818;fill:none;stroke-width:2}
  .brand .name{font-family:'Oswald';font-weight:600;letter-spacing:.08em;font-size:.95rem;text-transform:uppercase;line-height:1}
  .brand .sub{font-family:'DM Mono';font-size:.6rem;letter-spacing:.22em;color:var(--lav);text-transform:uppercase}
  .topbar .spacer{flex:1}
  .tb-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--olive);background:none}
  .tb-btn:hover{color:var(--lav);border-color:var(--line-strong)}
  .tb-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}

  .wrap{max-width:1340px;margin:0 auto;padding:30px 26px 80px}
  .view{display:none}.view.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
  .dot.amber{background:var(--amber);box-shadow:0 0 8px rgba(217,164,65,.5)}
  .dot.ready{background:var(--ready);box-shadow:0 0 8px rgba(171,129,205,.5)}
  .dot.green{background:var(--green);box-shadow:0 0 8px rgba(111,179,106,.5)}
  .dot.grey{background:var(--grey)}
  .chip{display:inline-block;font-family:'DM Mono';font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(189,187,176,.08);color:var(--silver);border:1px solid var(--line)}

  /* home */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 14px}
  .sec-head h2{font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--txt);font-weight:500}
  .sec-head .count{font-family:'DM Mono';font-size:.72rem;color:var(--olive)}
  .sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
  .session-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;transition:.18s}
  .session-card .s-name{font-family:'Oswald';font-weight:500;font-size:1.02rem;letter-spacing:.01em;margin-bottom:3px}
  .session-card .s-meta{font-family:'DM Mono';font-size:.66rem;color:var(--olive);letter-spacing:.04em}
  .session-card .s-stats{display:flex;gap:14px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  .session-card .stat{display:flex;align-items:center;gap:6px;font-family:'DM Mono';font-size:.7rem;color:var(--silver)}
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 20px}
  .filterbar .search{flex:1;min-width:220px;position:relative}
  .filterbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--olive);fill:none;stroke-width:1.8}
  .filterbar input,.filterbar select{background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:.85rem;padding:10px 13px;border-radius:9px;outline:none}
  .filterbar input{width:100%;padding-left:34px}
  .filterbar select{font-family:'DM Mono';font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--silver)}
  .filterbar input:focus,.filterbar select:focus{border-color:var(--lav)}
  .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
  .item-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
  .item-card:hover{border-color:var(--lav);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .item-card .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,#2a2626,#201d1d);display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
  .item-card .thumb img{width:100%;height:100%;object-fit:cover}
  .item-card .thumb .ph{width:34px;height:34px;stroke:rgba(189,187,176,.28);fill:none;stroke-width:1.4}
  .item-card .status{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px;background:rgba(20,18,18,.78);padding:4px 9px;border-radius:20px;font-family:'DM Mono';font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
  .item-card .body{padding:13px 14px 15px}
  .item-card .i-name{font-family:'Oswald';font-weight:500;font-size:.97rem;line-height:1.2;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-card .i-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
  .item-card .comp{font-family:'DM Mono';font-size:.72rem;color:var(--mauve)}
  .item-card .cog{font-family:'DM Mono';font-size:.66rem;color:var(--olive)}

  /* workspace */
  .ws-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .back{display:flex;align-items:center;gap:7px;font-family:'DM Mono';font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);background:none;border:none}
  .back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
  .back:hover{color:var(--lav)}
  .cols{display:grid;grid-template-columns:288px 1fr 348px;gap:18px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;border-bottom:1px solid var(--line)}
  .panel-head .ph-title{font-family:'DM Mono';font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lav)}
  .ro-badge{font-family:'DM Mono';font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);border:1px solid var(--line);padding:3px 7px;border-radius:5px}
  .field-photo{aspect-ratio:4/3;margin:15px 17px 0;border-radius:10px;background:linear-gradient(135deg,#2a2626,#201d1d);display:grid;place-items:center;border:1px solid var(--line);overflow:hidden}
  .field-photo img{width:100%;height:100%;object-fit:cover}
  .field-photo .ph{width:40px;height:40px;stroke:rgba(189,187,176,.3);fill:none;stroke-width:1.3}
  .frec{padding:16px 17px}
  .frec .fr-name{font-family:'Oswald';font-weight:600;font-size:1.2rem;line-height:1.15;margin-bottom:13px}
  .frow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:11px}
  .frow:last-child{border-bottom:none;margin-bottom:0}
  .frow dt{font-family:'DM Mono';font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
  .frow dd{font-size:.86rem;color:var(--txt);text-align:right;font-weight:500}
  .comp-box{margin:4px 17px 17px;padding:13px;border-radius:10px;background:rgba(171,129,205,.07);border:1px solid rgba(171,129,205,.2)}
  .comp-box .cb-range{font-family:'Oswald';font-weight:600;font-size:1.35rem;color:var(--mauve);margin-top:6px}
  .comp-box .cb-sub{font-family:'DM Mono';font-size:.64rem;color:var(--olive);margin-top:5px}
  .comp-box a{display:inline-flex;align-items:center;gap:5px;margin-top:11px;font-family:'DM Mono';font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--lav);text-decoration:none}
  .comp-box a svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}

  .center{display:flex;flex-direction:column;gap:18px}
  .sec-title{font-family:'DM Mono';font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--lav);display:flex;align-items:center;gap:9px}
  .sec-title .num{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:.6rem;color:var(--silver)}
  .dropzone{margin:15px 17px;border:1.5px dashed var(--line-strong);border-radius:11px;padding:22px;text-align:center;transition:.15s}
  .dropzone.drag{border-color:var(--lav);background:rgba(171,129,205,.06)}
  .dropzone:hover{border-color:var(--lav);background:rgba(171,129,205,.04)}
  .dropzone svg{width:26px;height:26px;stroke:var(--olive);fill:none;stroke-width:1.5;margin-bottom:8px}
  .dropzone .dz-main{font-size:.86rem;color:var(--silver)}
  .dropzone .dz-sub{font-family:'DM Mono';font-size:.6rem;color:var(--olive);margin-top:5px;letter-spacing:.05em}
  .photo-strip{display:flex;gap:9px;padding:0 17px 16px;flex-wrap:wrap}
  .photo-strip .pt{width:62px;height:62px;border-radius:8px;background:linear-gradient(135deg,#2a2626,#201d1d);border:1px solid var(--line);overflow:hidden;position:relative}
  .photo-strip .pt img{width:100%;height:100%;object-fit:cover}
  .photo-strip .pt.primary{border-color:var(--lav)}
  .photo-strip .pt .pbadge{position:absolute;bottom:0;left:0;right:0;font-family:'DM Mono';font-size:.46rem;text-align:center;background:var(--lav);color:#1a1818;letter-spacing:.08em;padding:1px}

  .ptabs{display:flex;gap:3px;margin:15px 17px 0;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:4px}
  .ptabs button{flex:1;font-family:'DM Mono';font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-mute);background:none;border:none;padding:8px 4px;border-radius:6px;transition:.15s;position:relative}
  .ptabs button.active{background:var(--grape);color:#fff}
  .ptabs button .pdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px;vertical-align:middle;background:transparent}
  .pt-done{background:var(--green)!important}.pt-draft{background:var(--amber)!important}
  .gen-row{display:flex;justify-content:space-between;align-items:center;padding:13px 17px 4px;gap:10px}
  .gen-btn{font-family:'DM Mono';font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#1a1818;background:linear-gradient(150deg,var(--lav),var(--mauve));border:none;padding:9px 14px;border-radius:8px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .gen-btn:disabled{opacity:.5}
  .gen-btn svg{width:13px;height:13px;stroke:#1a1818;fill:none;stroke-width:2}
  .copy-body{padding:8px 17px 17px}
  .fld{margin-top:13px}
  .fld label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .fld .lname{font-family:'DM Mono';font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--olive)}
  .fld .lcount{font-family:'DM Mono';font-size:.58rem;color:var(--olive)}
  .fld .lcount.warn{color:var(--amber)}
  .fld input,.fld textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);font-size:.88rem;padding:10px 12px;border-radius:9px;outline:none;resize:vertical;line-height:1.5}
  .fld input:focus,.fld textarea:focus{border-color:var(--lav)}
  .fld textarea{min-height:90px}

  .price-wrap{padding:15px 17px 18px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .price-block{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:14px}
  .price-block h4{font-family:'DM Mono';font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .price-block h4 .tag{font-size:.5rem;color:#1a1818;background:var(--lav);padding:2px 6px;border-radius:4px;letter-spacing:.06em}
  .pln{display:flex;justify-content:space-between;align-items:center;font-family:'DM Mono';font-size:.72rem;padding:5px 0;color:var(--txt-mute)}
  .pln .v{color:var(--txt)}.pln.muted .v{color:var(--olive)}.pln.neg .v{color:var(--mauve)}
  .pbig{display:flex;gap:10px;margin-top:11px;padding-top:12px;border-top:1px solid var(--line)}
  .pbig .pb{flex:1;text-align:center;padding:9px;border-radius:9px;background:rgba(171,129,205,.08);border:1px solid rgba(171,129,205,.2)}
  .pbig .pb .pb-lab{font-family:'DM Mono';font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}
  .pbig .pb .pb-val{font-family:'Oswald';font-weight:600;font-size:1.5rem;color:var(--mauve);margin-top:2px}
  .pbig .pb.floor .pb-val{color:var(--silver)}
  .price-input{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .price-input .pi-lab{font-family:'DM Mono';font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);flex:1}
  .price-input input{width:80px;background:var(--bg);border:1px solid var(--line);color:var(--txt);font-family:'DM Mono';font-size:.82rem;padding:7px 9px;border-radius:7px;outline:none;text-align:right}
  .price-input input:focus{border-color:var(--lav)}
  .pnote{margin-top:9px;font-family:'DM Mono';font-size:.56rem;letter-spacing:.04em;color:var(--olive)}

  .right{display:flex;flex-direction:column;gap:18px}
  .live-head{display:flex;align-items:center;gap:10px;padding:15px 17px}
  .live-head .lh-name{font-family:'Oswald';font-weight:500;font-size:1.02rem;line-height:1.15}
  .live-head .lh-status{font-family:'DM Mono';font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--silver);display:flex;align-items:center;gap:6px;margin-top:3px}
  .checklist{padding:4px 17px 17px}
  .pub-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .pub-row:last-child{border-bottom:none}
  .pub-platform{font-family:'DM Mono';font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;width:72px;flex:none;color:var(--silver)}
  .pub-url{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);font-family:'DM Mono';font-size:.64rem;padding:7px 9px;border-radius:7px;outline:none}
  .pub-url:focus{border-color:var(--lav)}
  .pub-url::placeholder{color:var(--olive)}
  .cbox{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;transition:.15s;background:none}
  .cbox.on{background:var(--green);border-color:var(--green)}
  .cbox svg{width:13px;height:13px;stroke:#1a1818;fill:none;stroke-width:2.6;opacity:0}
  .cbox.on svg{opacity:1}
  .sop{padding:6px 17px 17px}
  .sop-row{display:flex;align-items:center;gap:11px;padding:10px 0;font-size:.86rem;color:var(--txt-mute)}
  .sop-row.done{color:var(--txt)}
  .sop-tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center}
  .sop-tick svg{width:11px;height:11px;stroke:#1a1818;fill:none;stroke-width:3;opacity:0}
  .sop-row.done .sop-tick{background:var(--green);border-color:var(--green)}
  .sop-row.done .sop-tick svg{opacity:1}
  .save-bar{padding:0 17px 17px}
  .save-btn{width:100%;font-family:'DM Mono';font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#1a1818;background:linear-gradient(150deg,var(--grape),var(--lav));border:none;padding:13px;border-radius:10px;font-weight:500}
  .save-btn:disabled{opacity:.5}

  /* states */
  .loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:80px 0;color:var(--olive)}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--lav);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;padding:60px 0;color:var(--olive);font-family:'DM Mono';font-size:.8rem}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel-2);border:1px solid var(--line-strong);color:var(--txt);padding:13px 20px;border-radius:10px;font-size:.85rem;z-index:60;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--err);color:var(--err)}
  .toast.ok{border-color:var(--green)}

  /* settings modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,9,9,.7);backdrop-filter:blur(4px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line-strong);border-radius:16px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-size:1rem;letter-spacing:.04em;text-transform:uppercase}
  .modal-body{padding:18px 22px}
  .modal-body .mf{margin-bottom:14px}
  .modal-body .mf label{display:block;font-family:'DM Mono';font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-bottom:5px}
  .modal-body .mf input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);font-family:'DM Mono';font-size:.78rem;padding:9px 11px;border-radius:8px;outline:none}
  .modal-body .mf input:focus{border-color:var(--lav)}
  .modal-foot{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--silver);padding:10px 16px;border-radius:9px;font-family:'DM Mono';font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
  .btn-solid{background:linear-gradient(150deg,var(--grape),var(--lav));border:none;color:#fff;padding:10px 18px;border-radius:9px;font-family:'DM Mono';font-size:.66rem;letter-spacing:.08em;text-transform:uppercase}
  .modal-note{font-family:'DM Mono';font-size:.58rem;color:var(--olive);line-height:1.6;margin-top:4px}

  @media(max-width:1100px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z M4 9h16 M9 9v11"/></svg></div>
    <div><div class="name">Last Laugh Vintage</div><div class="sub">Studio</div></div>
  </div>
  <div class="spacer"></div>
  <button class="tb-btn" id="refreshBtn" title="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8 M21 4v4h-4"/></svg></button>
  <button class="tb-btn" id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M19 5l-2 2 M7 17l-2 2"/></svg></button>
</div>

<!-- HOME -->
<div id="view-home" class="view active">
  <div class="wrap">
    <div class="sec-head"><h2>Open Sessions</h2><span class="count" id="sessionsCount"></span></div>
    <div class="sessions" id="sessionsList"></div>
    <div class="sec-head"><h2>Inventory</h2><span class="count" id="invCount"></span></div>
    <div class="filterbar">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="fSearch" placeholder="Search items by name…"></div>
      <select id="fCat"><option value="">All Categories</option><option>POSTER</option><option>VHS</option><option>CASSETTE</option><option>TOY</option><option>VINTAGE ELECTRONICS</option><option>MEMORABILIA</option><option>HOME DECOR</option><option>OTHER</option></select>
      <select id="fStatus"><option value="">All Statuses</option><option>SOURCED</option><option>IN PROGRESS</option><option>LISTED</option><option>SOLD</option><option>ARCHIVED</option></select>
      <select id="fPlatform"><option value="">All Platforms</option><option>FACEBOOK</option><option>OFFERUP</option><option>EBAY</option><option>ETSY</option><option>MERCARI</option></select>
    </div>
    <div id="homeBody"></div>
  </div>
</div>

<!-- WORKSPACE -->
<div id="view-ws" class="view">
  <div class="wrap">
    <div class="ws-top">
      <button class="back" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Inventory</button>
      <span class="chip" id="wsSession"></span>
    </div>
    <div class="cols" id="wsCols"></div>
  </div>
</div>

<!-- settings -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-head"><h3>Credentials</h3><button class="tb-btn" id="modalClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12 M18 6L6 18"/></svg></button></div>
    <div class="modal-body">
      <div class="mf"><label>Anthropic API Key</label><input id="k_anthropic" type="password" placeholder="sk-ant-…"></div>
      <div class="mf"><label>Airtable API Key</label><input id="k_airtable" type="password" placeholder="pat…"></div>
      <div class="mf"><label>Base ID</label><input id="k_base" placeholder="app3DqxIJ1SUBKylb"></div>
      <div class="mf"><label>Items Table ID</label><input id="k_items" placeholder="tblFeToiIcEseekfH"></div>
      <div class="mf"><label>Listings Table ID</label><input id="k_listings" placeholder="tblW5u905moGRFsFw"></div>
      <div class="mf"><label>Sessions Table ID</label><input id="k_sessions" placeholder="tblGH4ziHZSneAtoI"></div>
      <p class="modal-note">Stored locally in this browser only (localStorage). Keys never leave the device except in direct calls to Airtable / Anthropic.</p>
    </div>
    <div class="modal-foot"><button class="btn-ghost" id="modalCancel">Cancel</button><button class="btn-solid" id="modalSave">Save &amp; Load</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   LLV STUDIO — config & state
   ============================================================ */
const LS = {
  anthropic:'llv_anthropic_key', airtable:'llv_airtable_key', base:'llv_base_id',
  items:'llv_items_table_id', listings:'llv_listings_table_id', sessions:'llv_sessions_table_id'
};
const DEFAULTS = { base:'app3DqxIJ1SUBKylb', items:'tblFeToiIcEseekfH', listings:'tblW5u905moGRFsFw', sessions:'tblGH4ziHZSneAtoI' };
const MODEL = 'claude-sonnet-4-5';

// Platforms — FB & OfferUp are local (shared ask/floor); eBay/Etsy/Mercari national.
// NOTE: these strings must EXACTLY match the PLATFORM single-select options in the
// LISTINGS table, or Airtable returns INVALID_MULTIPLE_CHOICE_OPTIONS. Add OFFERUP if missing.
const PLATFORMS = [
  { key:'FACEBOOK', label:'Facebook', local:true,  shipping:false },
  { key:'OFFERUP',  label:'OfferUp',  local:true,  shipping:false },
  { key:'EBAY',     label:'eBay',     local:false, shipping:true  },
  { key:'ETSY',     label:'Etsy',     local:false, shipping:true  },
  { key:'MERCARI',  label:'Mercari',  local:false, shipping:true  }
];
// Matches the LISTINGS · LISTING STATUS single-select options exactly.
const LISTING_STATUS = { draft:'DRAFT', ready:'READY', live:'LIVE', published:'PUBLISHED', sold:'SOLD' };
const POSTED_STATUSES = ['LIVE','PUBLISHED','SOLD']; // publish checkbox reads "on" for any of these

// Fee assumptions for the net calculator — verify against current platform rates.
const FEES = {
  EBAY:    { pct:0.1325, flat:0.40 },           // 13.25% + $0.40/order (>$10). Verified May 2026.
  MERCARI: { pct:0.10, procPct:0, procFlat:0 }  // Flat 10% — separate 2.9%+$0.50 processing fee removed Jan 2025. Verified May 2026.
};
const DEFAULT_BUFFER = 0.18;   // negotiation buffer for local ask price
const DEFAULT_MARGIN = 70;     // default target margin ($) — editable per item

let CFG = {};
let ITEMS = [];          // raw item records
let LISTINGS_BY_ITEM = {};// { itemRecId: { PLATFORM: listingRecord } }
let SESSIONS_BY_ID = {}; // { sessionRecId: sessionRecord }
let current = null;      // { item, listings, draft, pricing } for open workspace

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => (n==null||isNaN(n))?'—':'$'+Number(n).toFixed(2);
function todayISO(){ const d=new Date(); const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); } // explicit, not toLocaleDateString
function toast(msg,type){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(type?' '+type:''); clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',type==='err'?5000:2600); }
function loadCfg(){ CFG={}; for(const k in LS){ CFG[k]=localStorage.getItem(LS[k])||DEFAULTS[k]||''; } }
function cfgReady(){ return CFG.airtable && CFG.base && CFG.items && CFG.listings; }

/* ============================================================
   Airtable
   ============================================================ */
async function atList(tableId){
  let out=[], offset=null;
  do{
    const url=new URL(`https://api.airtable.com/v0/${CFG.base}/${tableId}`);
    url.searchParams.set('pageSize','100');
    if(offset) url.searchParams.set('offset',offset);
    const r=await fetch(url,{headers:{Authorization:'Bearer '+CFG.airtable}});
    if(!r.ok) throw new Error('Airtable '+r.status+' on '+tableId+': '+(await r.text()).slice(0,180));
    const j=await r.json(); out=out.concat(j.records||[]); offset=j.offset;
  }while(offset);
  return out;
}
async function atPatch(tableId,recId,fields){
  const r=await fetch(`https://api.airtable.com/v0/${CFG.base}/${tableId}/${recId}`,{
    method:'PATCH',headers:{Authorization:'Bearer '+CFG.airtable,'Content-Type':'application/json'},
    body:JSON.stringify({fields, typecast:true})});
  if(!r.ok) throw new Error('Airtable PATCH '+r.status+': '+(await r.text()).slice(0,200));
  return (await r.json());
}
async function atCreate(tableId,fields){
  const r=await fetch(`https://api.airtable.com/v0/${CFG.base}/${tableId}`,{
    method:'POST',headers:{Authorization:'Bearer '+CFG.airtable,'Content-Type':'application/json'},
    body:JSON.stringify({fields, typecast:true})});
  if(!r.ok) throw new Error('Airtable CREATE '+r.status+': '+(await r.text()).slice(0,200));
  return (await r.json());
}
// Native attachment upload (content API). Verified against official docs (May 2026):
// POST api.airtable.com/v0/{base}/{recId}/{fieldNameOrId}/uploadAttachment
// Body: { contentType, file:<base64 NO data: prefix>, filename }. 5MB cap per file. Returns updated record.
async function atUploadAttachment(recId, fieldName, base64NoPrefix, contentType, filename){
  const r=await fetch(`https://api.airtable.com/v0/${CFG.base}/${recId}/${encodeURIComponent(fieldName)}/uploadAttachment`,{
    method:'POST',headers:{Authorization:'Bearer '+CFG.airtable,'Content-Type':'application/json'},
    body:JSON.stringify({contentType, file:base64NoPrefix, filename})});
  if(!r.ok) throw new Error('Attachment upload '+r.status+': '+(await r.text()).slice(0,200));
  return (await r.json());
}

/* ---------- field readers (defensive: lookups can be arrays) ---------- */
const F = (rec,name) => rec && rec.fields ? rec.fields[name] : undefined;
const Fstr = (rec,name) => { let v=F(rec,name); if(Array.isArray(v)) v=v[0]; return v==null?'':String(v); };
const Fnum = (rec,name) => { let v=F(rec,name); if(Array.isArray(v)) v=v[0]; return (v==null||v==='')?null:Number(v); };
function firstPhotoUrl(rec){ const p=F(rec,'PHOTOS'); if(Array.isArray(p)&&p.length){ return (p[0].thumbnails&&p[0].thumbnails.large&&p[0].thumbnails.large.url)||p[0].url; } return null; }

/* ============================================================
   Load
   ============================================================ */
async function loadAll(){
  if(!cfgReady()){ openModal(); $('#homeBody').innerHTML='<div class="empty">Add your credentials to begin.</div>'; return; }
  $('#homeBody').innerHTML='<div class="loading"><div class="spinner"></div><span class="label">Loading inventory…</span></div>';
  try{
    const [items, listings, sessions] = await Promise.all([ atList(CFG.items), atList(CFG.listings), CFG.sessions?atList(CFG.sessions):[] ]);
    ITEMS=items;
    SESSIONS_BY_ID={}; sessions.forEach(s=>SESSIONS_BY_ID[s.id]=s);
    LISTINGS_BY_ITEM={};
    listings.forEach(l=>{
      const link=F(l,'ITEM'); const itemId=Array.isArray(link)?link[0]:link;
      if(!itemId) return;
      const plat=Fstr(l,'PLATFORM').toUpperCase();
      (LISTINGS_BY_ITEM[itemId]=LISTINGS_BY_ITEM[itemId]||{})[plat]=l;
    });
    renderSessions(); renderInventory();
  }catch(e){ console.error(e); toast(e.message,'err'); $('#homeBody').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

/* ---------- status → dot ---------- */
function statusDot(status){
  status=(status||'').toUpperCase();
  if(status==='IN PROGRESS') return {cls:'amber',label:'In Progress'};
  if(status==='LISTED') return {cls:'green',label:'Published'};
  if(status==='SOLD') return {cls:'green',label:'Sold'};
  if(status==='ARCHIVED') return {cls:'grey',label:'Archived'};
  return {cls:'ready',label:'Ready'}; // SOURCED / blank
}

/* ---------- sessions ---------- */
function renderSessions(){
  // group items by SESSION link; show sessions with unfinished (non LISTED/SOLD/ARCHIVED) items
  const byS={};
  ITEMS.forEach(it=>{ const link=F(it,'SESSION'); const sid=Array.isArray(link)?link[0]:link; if(!sid)return; (byS[sid]=byS[sid]||[]).push(it); });
  const rows=[]; let openCount=0, unfinished=0;
  Object.keys(byS).forEach(sid=>{
    const items=byS[sid]; const cnt={ready:0,amber:0,green:0};
    items.forEach(it=>{ const c=statusDot(Fstr(it,'ITEM STATUS')).cls; if(c==='ready')cnt.ready++; else if(c==='amber')cnt.amber++; else if(c==='green')cnt.green++; });
    const open=cnt.ready+cnt.amber>0; if(open){openCount++; unfinished+=cnt.ready+cnt.amber;}
    const s=SESSIONS_BY_ID[sid];
    const name=s?(Fstr(s,'SESSION NAME')||Fstr(s,'NAME')||Fstr(s,'LOCATION')||'Session'):'Session';
    const type=s?Fstr(s,'SESSION TYPE'):''; const date=s?Fstr(s,'DATE'):'';
    rows.push({open, html:`<div class="session-card">
        <div class="s-name">${esc(name)}</div>
        <div class="s-meta">${esc([type,date,items.length+' items'].filter(Boolean).join(' · '))}</div>
        <div class="s-stats">
          <span class="stat"><span class="dot ready"></span>${cnt.ready}</span>
          <span class="stat"><span class="dot amber"></span>${cnt.amber}</span>
          <span class="stat"><span class="dot green"></span>${cnt.green}</span>
        </div></div>`});
  });
  const openRows=rows.filter(r=>r.open);
  $('#sessionsList').innerHTML = openRows.length?openRows.map(r=>r.html).join(''):'<div class="empty" style="grid-column:1/-1;padding:24px 0">No open sessions.</div>';
  $('#sessionsCount').textContent = openCount+' open · '+unfinished+' unfinished items';
}

/* ---------- inventory ---------- */
function renderInventory(){
  const q=$('#fSearch').value.trim().toLowerCase(), cat=$('#fCat').value, st=$('#fStatus').value, plat=$('#fPlatform').value;
  const list=ITEMS.filter(it=>{
    if(q && !Fstr(it,'ITEM NAME').toLowerCase().includes(q)) return false;
    if(cat && Fstr(it,'CATEGORY')!==cat) return false;
    if(st && Fstr(it,'ITEM STATUS')!==st) return false;
    if(plat){ const ls=LISTINGS_BY_ITEM[it.id]||{}; if(!ls[plat]) return false; }
    return true;
  });
  $('#invCount').textContent = ITEMS.length+' items total';
  if(!list.length){ $('#homeBody').innerHTML='<div class="empty">No items match.</div>'; return; }
  $('#homeBody').innerHTML='<div class="inv-grid">'+list.map(it=>{
    const d=statusDot(Fstr(it,'ITEM STATUS')); const url=firstPhotoUrl(it);
    const lo=Fnum(it,'EBAY COMP LOW'), hi=Fnum(it,'EBAY COMP HIGH');
    const comp=(lo!=null||hi!=null)?(money(lo).replace('.00','')+'–'+money(hi).replace('.00','')):'—';
    return `<div class="item-card" data-id="${it.id}">
      <div class="thumb">${url?`<img src="${esc(url)}" alt="">`:`<svg class="ph" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`}
        <div class="status"><span class="dot ${d.cls}"></span>${d.label}</div></div>
      <div class="body">
        <div class="i-name">${esc(Fstr(it,'ITEM NAME'))}</div>
        <span class="chip">${esc(Fstr(it,'CATEGORY')||'—')}</span> <span class="chip">${esc(Fstr(it,'CONDITION')||'—')}</span>
        <div class="i-row"><span class="comp">${esc(comp)}</span><span class="cog">COG ${money(Fnum(it,'COST OF GOODS')).replace('.00','')}</span></div>
      </div></div>`;
  }).join('')+'</div>';
  document.querySelectorAll('.item-card').forEach(c=>c.addEventListener('click',()=>openWorkspace(c.dataset.id)));
}
['#fSearch','#fCat','#fStatus','#fPlatform'].forEach(s=>{ const el=$(s); el&&el.addEventListener('input',renderInventory); });

/* ============================================================
   Workspace
   ============================================================ */
function pricing(item){
  const cog=Fnum(item,'COST OF GOODS')||0;
  const margin = current && current.margin!=null ? current.margin : DEFAULT_MARGIN;
  const buffer = current && current.buffer!=null ? current.buffer : DEFAULT_BUFFER;
  const floor = cog + margin;            // local: no fees
  const ask = Math.round(floor*(1+buffer));
  return {cog,margin,buffer,floor:Math.round(floor),ask};
}
function netCalc(listPrice){
  const e=FEES.EBAY, m=FEES.MERCARI;
  const eFee=listPrice*e.pct+e.flat;
  const mFee=listPrice*m.pct + (listPrice*m.procPct+m.procFlat);
  return { ebayFee:eFee, ebayNet:listPrice-eFee, mercFee:mFee, mercNet:listPrice-mFee };
}

function openWorkspace(itemId){
  const item=ITEMS.find(i=>i.id===itemId); if(!item) return;
  const listings=LISTINGS_BY_ITEM[itemId]||{};
  // build editable draft from existing listings
  const draft={}; PLATFORMS.forEach(p=>{
    const l=listings[p.key];
    draft[p.key]={ title:l?Fstr(l,'TITLE'):'', body:l?Fstr(l,'LISTING BODY'):'', keywords:l?Fstr(l,'KEYWORDS'):'',
      price:l?Fnum(l,'LIST PRICE'):null, url:l?Fstr(l,'LISTING URL'):'',
      published:l?POSTED_STATUSES.includes(Fstr(l,'LISTING STATUS').toUpperCase()):false, recId:l?l.id:null };
  });
  current={ item, listings, draft, active:'FACEBOOK',
            margin: Fnum(item,'FLOOR PRICE')!=null ? (Fnum(item,'FLOOR PRICE')-(Fnum(item,'COST OF GOODS')||0)) : DEFAULT_MARGIN,
            buffer: DEFAULT_BUFFER, listInput:(Fnum(item,'EBAY COMP LOW')||50) };
  renderWorkspace();
  $('#view-home').classList.remove('active'); $('#view-ws').classList.add('active'); window.scrollTo(0,0);
}

function renderWorkspace(){
  const it=current.item;
  const sid=(()=>{const l=F(it,'SESSION');return Array.isArray(l)?l[0]:l;})();
  const s=SESSIONS_BY_ID[sid];
  $('#wsSession').textContent = s?[Fstr(s,'SESSION NAME')||Fstr(s,'LOCATION')||'Session',Fstr(s,'DATE')].filter(Boolean).join(' · '):'';
  const pr=pricing(it), nc=netCalc(current.listInput), photoUrl=firstPhotoUrl(it);
  const photos=Array.isArray(F(it,'PHOTOS'))?F(it,'PHOTOS'):[];
  const lo=Fnum(it,'EBAY COMP LOW'), hi=Fnum(it,'EBAY COMP HIGH'), sold=Fnum(it,'EBAY COMP SOLD COUNT');
  const ebayUrl='https://www.ebay.com/sch/i.html?_nkw='+encodeURIComponent(Fstr(it,'ITEM NAME'))+'&LH_Sold=1&LH_Complete=1';

  /* LEFT */
  const left=`<div class="panel">
    <div class="panel-head"><span class="ph-title">Field Record</span><span class="ro-badge">Read-only</span></div>
    <div class="field-photo">${photoUrl?`<img src="${esc(photoUrl)}">`:`<svg class="ph" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`}</div>
    <div class="frec"><div class="fr-name">${esc(Fstr(it,'ITEM NAME'))}</div>
      <div class="frow"><dt>Category</dt><dd>${esc(Fstr(it,'CATEGORY')||'—')}</dd></div>
      <div class="frow"><dt>Condition</dt><dd>${esc(Fstr(it,'CONDITION')||'—')}</dd></div>
      <div class="frow"><dt>COG</dt><dd>${money(Fnum(it,'COST OF GOODS'))}</dd></div>
      <div class="frow"><dt>Sourced From</dt><dd>${esc(Fstr(it,'SOURCED FROM')||'—')}</dd></div>
      <div class="frow"><dt>Date Sourced</dt><dd>${esc(Fstr(it,'DATE SOURCED')||'—')}</dd></div>
      <div class="frow"><dt>Field Status</dt><dd>${esc(Fstr(it,'ITEM STATUS')||'SOURCED')}</dd></div>
    </div>
    <div class="comp-box"><span class="label">eBay Sold Comps</span>
      <div class="cb-range">${(lo!=null||hi!=null)?money(lo).replace('.00','')+' – '+money(hi).replace('.00',''):'—'}</div>
      <div class="cb-sub">low – high${sold!=null?' · '+sold+' sold':''}</div>
      <a href="${esc(ebayUrl)}" target="_blank"><svg viewBox="0 0 24 24"><path d="M7 17L17 7 M9 7h8v8"/></svg>View comps on eBay</a>
    </div></div>`;

  /* CENTER */
  const tabs=PLATFORMS.map(p=>{ const d=current.draft[p.key]; const cls=d.published?'pt-done':(d.title||d.body?'pt-draft':''); 
    return `<button class="${p.key===current.active?'active':''}" data-tab="${p.key}">${p.label}<span class="pdot ${cls}"></span></button>`;}).join('');
  const ap=PLATFORMS.find(p=>p.key===current.active), d=current.draft[current.active];
  const isEbay=current.active==='EBAY';
  const titleCount = isEbay ? `<span class="lcount ${d.title.length>80?'warn':''}" id="titleCount">${d.title.length} / 80</span>` : '';
  const center=`<div class="panel">
      <div class="panel-head"><span class="sec-title"><span class="num">1</span>Photos</span></div>
      <div class="dropzone" id="dropzone"><svg viewBox="0 0 24 24"><path d="M12 16V4 M7 9l5-5 5 5 M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <div class="dz-main">Drop photos or click to upload</div>
        <div class="dz-sub">attaches to ITEMS · PHOTOS — resized · ≤5MB each</div>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none"></div>
      <div class="photo-strip">${photos.length?photos.map((p,i)=>`<div class="pt ${i===0?'primary':''}"><img src="${esc((p.thumbnails&&p.thumbnails.small&&p.thumbnails.small.url)||p.url)}">${i===0?'<span class="pbadge">PRIMARY</span>':''}</div>`).join(''):'<span class="label" style="padding:4px 0">No photos yet</span>'}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="sec-title"><span class="num">2</span>Listing Copy</span></div>
      <div class="ptabs" id="ptabs">${tabs}</div>
      <div class="gen-row"><span class="label">draft pre-filled from field data</span>
        <button class="gen-btn" id="genBtn"><svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>Generate all platforms</button></div>
      <div class="copy-body">
        <div class="fld"><label><span class="lname">Title</span>${titleCount}</label><input id="d_title" value="${esc(d.title)}"></div>
        <div class="fld"><label><span class="lname">Listing Body</span></label><textarea id="d_body">${esc(d.body)}</textarea></div>
        <div class="fld"><label><span class="lname">${ap&&ap.key==='ETSY'?'Tags':'Keywords'}</span></label><input id="d_keywords" value="${esc(d.keywords)}"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="sec-title"><span class="num">3</span>Pricing</span></div>
      <div class="price-wrap">
        <div class="price-block"><h4>Facebook · OfferUp <span class="tag">LOCAL</span></h4>
          <div class="pln muted"><span>COG</span><span class="v">${money(pr.cog)}</span></div>
          <div class="pln muted"><span>Fees (local pickup)</span><span class="v">$0.00</span></div>
          <div class="price-input"><span class="pi-lab">Target margin</span><input id="p_margin" value="$${pr.margin}"></div>
          <div class="price-input"><span class="pi-lab">Negotiation buffer</span><input id="p_buffer" value="${Math.round(pr.buffer*100)}%"></div>
          <div class="pbig"><div class="pb"><div class="pb-lab">Ask</div><div class="pb-val" id="v_ask">$${pr.ask}</div></div>
            <div class="pb floor"><div class="pb-lab">Floor</div><div class="pb-val" id="v_floor">$${pr.floor}</div></div></div>
          <div class="pnote">shared ask / floor — both negotiable, no fees</div>
        </div>
        <div class="price-block"><h4>eBay / Mercari <span class="tag">NET</span></h4>
          <div class="price-input"><span class="pi-lab">List price</span><input id="p_list" value="$${current.listInput}"></div>
          <div class="pln"><span>eBay fee (${(FEES.EBAY.pct*100).toFixed(2)}% + $${FEES.EBAY.flat.toFixed(2)})</span><span class="v" id="v_efee">−${money(nc.ebayFee)}</span></div>
          <div class="pln neg"><span>eBay net</span><span class="v" id="v_enet">${money(nc.ebayNet)}</span></div>
          <div class="pln" style="margin-top:6px"><span>Mercari fee (10%)</span><span class="v" id="v_mfee">−${money(nc.mercFee)}</span></div>
          <div class="pln neg"><span>Mercari net</span><span class="v" id="v_mnet">${money(nc.mercNet)}</span></div>
        </div>
      </div>
    </div>`;

  /* RIGHT */
  const itemStatus=Fstr(it,'ITEM STATUS')||'SOURCED'; const sd=statusDot(itemStatus);
  const pubCount=PLATFORMS.filter(p=>current.draft[p.key].published).length;
  const pubRows=PLATFORMS.map(p=>{ const dr=current.draft[p.key];
    return `<div class="pub-row"><span class="pub-platform">${p.label}</span>
      <input class="pub-url" data-url="${p.key}" value="${esc(dr.url)}" placeholder="paste listing URL…">
      <button class="cbox ${dr.published?'on':''}" data-pub="${p.key}"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg></button></div>`;}).join('');
  const anyCopy=PLATFORMS.some(p=>current.draft[p.key].title||current.draft[p.key].body);
  const sop=[ {label:'Photos uploaded',done:photos.length>0},
    {label:'Listing copy reviewed',done:anyCopy},
    {label:'Price set',done:Fnum(it,'ASK PRICE')!=null},
    {label:'All platforms published',done:pubCount===PLATFORMS.length} ];
  const right=`<div class="panel">
      <div class="panel-head"><span class="ph-title">Live Record</span></div>
      <div class="live-head"><span class="dot ${sd.cls}" style="width:12px;height:12px"></span>
        <div><div class="lh-name">${esc(Fstr(it,'ITEM NAME'))}</div><div class="lh-status"><span>${esc(itemStatus)}</span> · ${pubCount} of ${PLATFORMS.length} published</div></div></div>
      <div style="padding:0 17px"><span class="label">Publish Checklist</span></div>
      <div class="checklist">${pubRows}</div>
    </div>
    <div class="panel"><div class="panel-head"><span class="ph-title">Item Checklist</span></div>
      <div class="sop">${sop.map(r=>`<div class="sop-row ${r.done?'done':''}"><span class="sop-tick"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg></span>${r.label}</div>`).join('')}</div>
      <div class="save-bar"><button class="save-btn" id="saveBtn">Save to Airtable</button></div>
    </div>`;

  $('#wsCols').innerHTML = `<div>${left}</div><div class="center">${center}</div><div class="right">${right}</div>`;
  wireWorkspace();
}

function wireWorkspace(){
  // tabs — persist current field edits before switching
  document.querySelectorAll('#ptabs button').forEach(b=>b.addEventListener('click',()=>{ syncDraftFields(); current.active=b.dataset.tab; renderWorkspace(); }));
  // copy field edits
  ['d_title','d_body','d_keywords'].forEach(id=>{ const el=$('#'+id); if(!el)return; el.addEventListener('input',()=>{ syncDraftFields(); if(id==='d_title'&&current.active==='EBAY'){const c=$('#titleCount'); if(c){c.textContent=el.value.length+' / 80'; c.classList.toggle('warn',el.value.length>80);} } }); });
  // pricing inputs
  const mEl=$('#p_margin'), bEl=$('#p_buffer'), lEl=$('#p_list');
  function recalc(){ current.margin=parseFloat((mEl.value||'').replace(/[^0-9.]/g,''))||0; current.buffer=(parseFloat((bEl.value||'').replace(/[^0-9.]/g,''))||0)/100; current.listInput=parseFloat((lEl.value||'').replace(/[^0-9.]/g,''))||0;
    const pr=pricing(current.item), nc=netCalc(current.listInput);
    $('#v_ask').textContent='$'+pr.ask; $('#v_floor').textContent='$'+pr.floor;
    $('#v_efee').textContent='−'+money(nc.ebayFee); $('#v_enet').textContent=money(nc.ebayNet);
    $('#v_mfee').textContent='−'+money(nc.mercFee); $('#v_mnet').textContent=money(nc.mercNet); }
  [mEl,bEl,lEl].forEach(el=>el&&el.addEventListener('input',recalc));
  // publish url + checkbox
  document.querySelectorAll('[data-url]').forEach(el=>el.addEventListener('input',()=>{ current.draft[el.dataset.url].url=el.value; }));
  document.querySelectorAll('[data-pub]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.pub; current.draft[k].published=!current.draft[k].published; renderWorkspace(); }));
  // photos
  const dz=$('#dropzone'), fi=$('#fileInput');
  if(dz&&fi){ dz.addEventListener('click',()=>fi.click());
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
    dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');handleFiles(e.dataTransfer.files);});
    fi.addEventListener('change',()=>handleFiles(fi.files)); }
  // generate + save
  $('#genBtn')&&$('#genBtn').addEventListener('click',generateAll);
  $('#saveBtn')&&$('#saveBtn').addEventListener('click',saveAll);
}
function syncDraftFields(){ const d=current.draft[current.active]; const t=$('#d_title'),b=$('#d_body'),k=$('#d_keywords'); if(t)d.title=t.value; if(b)d.body=b.value; if(k)d.keywords=k.value; }

/* ---------- photos ---------- */
function resizeToBase64(file,maxDim=1600,quality=0.85){
  return new Promise((res,rej)=>{ const img=new Image(); const rd=new FileReader();
    rd.onload=()=>{ img.onload=()=>{ let{width:w,height:h}=img; if(w>h&&w>maxDim){h=h*maxDim/w;w=maxDim;} else if(h>maxDim){w=w*maxDim/h;h=maxDim;}
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      const durl=cv.toDataURL('image/jpeg',quality); res({base64:durl.split(',')[1],contentType:'image/jpeg'}); };
      img.onerror=rej; img.src=rd.result; }; rd.onerror=rej; rd.readAsDataURL(file); });
}
async function handleFiles(files){
  if(!files||!files.length) return;
  toast('Uploading '+files.length+' photo'+(files.length>1?'s':'')+'…');
  try{ for(const f of files){ const {base64,contentType}=await resizeToBase64(f);
      const updated=await atUploadAttachment(current.item.id,'PHOTOS',base64,contentType,(f.name||'photo')+'.jpg');
      // refresh item record in memory
      const idx=ITEMS.findIndex(i=>i.id===current.item.id); if(idx>=0 && updated && updated.fields){ ITEMS[idx]=updated; current.item=updated; } }
    toast('Photos uploaded','ok'); renderWorkspace();
  }catch(e){ console.error(e); toast(e.message,'err'); }
}

/* ---------- generation ---------- */
async function generateAll(){
  if(!CFG.anthropic){ toast('Add your Anthropic key in settings','err'); return; }
  const it=current.item; const btn=$('#genBtn'); btn.disabled=true; btn.textContent='Generating…';
  const ctx={ name:Fstr(it,'ITEM NAME'), category:Fstr(it,'CATEGORY'), condition:Fstr(it,'CONDITION'),
    cog:Fnum(it,'COST OF GOODS'), comp_low:Fnum(it,'EBAY COMP LOW'), comp_high:Fnum(it,'EBAY COMP HIGH'),
    notes:Fstr(it,'AI IDENTIFICATION NOTES'), city:'Long Beach, CA' };
  const prompt=`You write reselling listings for a vintage/collectible reseller (Last Laugh Vintage, ${ctx.city}). 
Item data: ${JSON.stringify(ctx)}
Write platform-optimized copy for FIVE platforms. Return ONLY raw JSON (no markdown, no prose) with this exact shape:
{"FACEBOOK":{"title":"","body":"","keywords":""},"OFFERUP":{"title":"","body":"","keywords":""},"EBAY":{"title":"","body":"","keywords":""},"ETSY":{"title":"","body":"","keywords":""},"MERCARI":{"title":"","body":"","keywords":""}}
Rules: FACEBOOK & OFFERUP = short, casual, local-pickup friendly. EBAY title MUST be <=80 chars, keyword-dense. ETSY = keyword-front-loaded title + comma tag list in keywords. MERCARI = concise, shipping-friendly. Be accurate to the condition; never invent specifics not implied by the data.`;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{ method:'POST',
      headers:{'x-api-key':CFG.anthropic,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true','Content-Type':'application/json'},
      body:JSON.stringify({model:MODEL,max_tokens:1500,messages:[{role:'user',content:prompt}]}) });
    if(!r.ok) throw new Error('Anthropic '+r.status+': '+(await r.text()).slice(0,200));
    const j=await r.json();
    const text=(j.content||[]).map(c=>c.type==='text'?c.text:'').join('').trim().replace(/^```json|^```|```$/g,'').trim();
    const data=JSON.parse(text);
    PLATFORMS.forEach(p=>{ const g=data[p.key]; if(g){ const d=current.draft[p.key]; d.title=g.title||d.title; d.body=g.body||d.body; d.keywords=g.keywords||d.keywords; } });
    toast('Listings generated','ok'); renderWorkspace();
  }catch(e){ console.error(e); toast('Generate failed: '+e.message,'err'); }
  finally{ btn.disabled=false; }
}

/* ---------- save ---------- */
async function saveAll(){
  syncDraftFields();
  const it=current.item, btn=$('#saveBtn'); btn.disabled=true; btn.textContent='Saving…';
  const pr=pricing(it);
  try{
    // 1) item-level pricing
    await atPatch(CFG.items, it.id, { 'ASK PRICE':pr.ask, 'FLOOR PRICE':pr.floor });
    // 2) per-platform listings (upsert only platforms that have content or a URL)
    for(const p of PLATFORMS){
      const d=current.draft[p.key];
      if(!(d.title||d.body||d.keywords||d.url||d.published)) continue;
      const isLocal=p.local;
      const fields={ 'TITLE':d.title, 'PLATFORM':p.key, 'LISTING BODY':d.body, 'KEYWORDS':d.keywords,
        'LIST PRICE': isLocal?pr.ask:(d.price||current.listInput||null),
        'LISTING STATUS': d.published?LISTING_STATUS.live:LISTING_STATUS.draft,
        'LISTING URL': d.url||'', 'ITEM':[it.id] };
      if(d.published) fields['DATE PUBLISHED']=todayISO();
      if(d.recId){ await atPatch(CFG.listings,d.recId,fields); }
      else { const created=await atCreate(CFG.listings,fields); d.recId=created.id; (LISTINGS_BY_ITEM[it.id]=LISTINGS_BY_ITEM[it.id]||{})[p.key]=created; }
    }
    // 3) roll up ITEM STATUS
    const pubCount=PLATFORMS.filter(p=>current.draft[p.key].published).length;
    const anyCopy=PLATFORMS.some(p=>current.draft[p.key].title||current.draft[p.key].body);
    let newStatus=Fstr(it,'ITEM STATUS')||'SOURCED';
    if(pubCount===PLATFORMS.length) newStatus='LISTED';
    else if(anyCopy||pubCount>0) newStatus='IN PROGRESS';
    if(newStatus!==Fstr(it,'ITEM STATUS')){ const u=await atPatch(CFG.items,it.id,{'ITEM STATUS':newStatus}); const idx=ITEMS.findIndex(i=>i.id===it.id); if(idx>=0){ITEMS[idx]=u; current.item=u;} }
    else { const idx=ITEMS.findIndex(i=>i.id===it.id); if(idx>=0){ ITEMS[idx].fields['ASK PRICE']=pr.ask; ITEMS[idx].fields['FLOOR PRICE']=pr.floor; } }
    toast('Saved to Airtable','ok'); renderWorkspace();
  }catch(e){ console.error(e); toast(e.message,'err'); }
  finally{ btn.disabled=false; btn.textContent='Save to Airtable'; }
}

/* ============================================================
   settings modal + boot
   ============================================================ */
function openModal(){ loadCfg();
  $('#k_anthropic').value=localStorage.getItem(LS.anthropic)||'';
  $('#k_airtable').value=localStorage.getItem(LS.airtable)||'';
  $('#k_base').value=CFG.base; $('#k_items').value=CFG.items; $('#k_listings').value=CFG.listings; $('#k_sessions').value=CFG.sessions;
  $('#modal').classList.add('open'); }
function closeModal(){ $('#modal').classList.remove('open'); }
$('#settingsBtn').addEventListener('click',openModal);
$('#modalClose').addEventListener('click',closeModal);
$('#modalCancel').addEventListener('click',closeModal);
$('#modalSave').addEventListener('click',()=>{
  localStorage.setItem(LS.anthropic,$('#k_anthropic').value.trim());
  localStorage.setItem(LS.airtable,$('#k_airtable').value.trim());
  localStorage.setItem(LS.base,$('#k_base').value.trim());
  localStorage.setItem(LS.items,$('#k_items').value.trim());
  localStorage.setItem(LS.listings,$('#k_listings').value.trim());
  localStorage.setItem(LS.sessions,$('#k_sessions').value.trim());
  loadCfg(); closeModal(); loadAll();
});
$('#backBtn').addEventListener('click',()=>{ $('#view-ws').classList.remove('active'); $('#view-home').classList.add('active'); renderSessions(); renderInventory(); window.scrollTo(0,0); });
$('#refreshBtn').addEventListener('click',loadAll);

loadCfg(); loadAll();
</script>
