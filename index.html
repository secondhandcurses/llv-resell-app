<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Last Laugh">
<meta name="theme-color" content="#111010">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Last Laugh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111010;
  --surface: #1a1818;
  --raised: #222020;
  --border: #2e2c2c;
  --lav: #c4b5fd;
  --green: #6FB36A;
  --olive: #8A897C;
  --silver: #BDBBB0;
  --dim: #4a4846;
  --amber: #e8a230;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body {
  font-family: 'DM Mono', monospace;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.brand {
  text-align: center;
  margin-bottom: 48px;
  animation: fadeDown .6s ease both;
}
.brand h1 {
  font-family: 'Oswald', sans-serif;
  font-weight: 600;
  font-size: clamp(2rem, 8vw, 3.2rem);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--lav);
  line-height: 1;
}
.brand p {
  font-size: .68rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--olive);
  margin-top: 10px;
}

.modes {
  display: flex;
  gap: 16px;
  width: 100%;
  max-width: 480px;
  animation: fadeUp .6s ease .15s both;
  flex-wrap: wrap;
}

.mode-card {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px;
  padding: 36px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  text-decoration: none;
  transition: all .2s ease;
  position: relative;
  overflow: hidden;
}
.mode-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .2s ease;
  border-radius: 15px;
}
.mode-card:active { transform: scale(.97); }
.mode-card:hover::before, .mode-card:active::before { opacity: 1; }

.mode-card.studio { border-color: rgba(111,179,106,.25); }
.mode-card.studio::before { background: rgba(111,179,106,.04); }
.mode-card.studio:hover, .mode-card.studio:active { border-color: rgba(111,179,106,.5); }

.mode-card.field { border-color: rgba(196,181,253,.25); }
.mode-card.field::before { background: rgba(196,181,253,.04); }
.mode-card.field:hover, .mode-card.field:active { border-color: rgba(196,181,253,.5); }

.mode-card.sourcing { border-color: rgba(232,162,48,.25); }
.mode-card.sourcing::before { background: rgba(232,162,48,.04); }
.mode-card.sourcing:hover, .mode-card.sourcing:active { border-color: rgba(232,162,48,.5); }

.sourcing .mode-icon svg { stroke: var(--amber); }
.sourcing .mode-label { color: var(--amber); }

.mode-icon {
  display: flex; align-items: center; justify-content: center;
}
.mode-icon svg { width: 100%; height: 100%; }
.studio .mode-icon svg { stroke: var(--green); }
.field  .mode-icon svg { stroke: var(--lav); }

.mode-label {
  font-family: 'Oswald', sans-serif;
  font-weight: 500;
  font-size: 1.1rem;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.studio .mode-label { color: var(--green); }
.field  .mode-label { color: var(--lav); }

.mode-desc {
  font-size: .62rem;
  letter-spacing: .06em;
  color: var(--olive);
  text-align: center;
  line-height: 1.5;
}

.footer {
  position: fixed;
  bottom: 20px;
  font-size: .56rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  animation: fadeUp .6s ease .3s both;
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .modes { flex-direction: column; }
  .mode-card { padding: 22px 20px; flex-direction: row; gap: 16px; }
  .mode-icon { width: 36px; height: 36px; flex: none; }
  .mode-text { text-align: left; }
  .mode-desc { text-align: left; }
}
</style>
</head>
<body>

<div class="brand">
  <h1>Last Laugh</h1>
  <p>Vintage · Resale · Toolkit</p>
</div>

<div class="modes">
  <a href="/field.html" class="mode-card field">
    <div class="mode-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V5a2 2 0 0 1 2-2h2 M17 3h2a2 2 0 0 1 2 2v2 M21 17v2a2 2 0 0 1-2 2h-2 M7 21H5a2 2 0 0 1-2-2v-2"/>
        <line x1="12" y1="7" x2="12" y2="17"/>
        <line x1="7" y1="12" x2="17" y2="12"/>
      </svg>
    </div>
    <div class="mode-text">
      <div class="mode-label">Field</div>
      <div class="mode-desc">Scan · Snap · Source</div>
    </div>
  </a>

  <a href="/studio.html" class="mode-card studio">
    <div class="mode-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
    </div>
    <div class="mode-text">
      <div class="mode-label">Studio</div>
      <div class="mode-desc">Inventory · Listings · Lots</div>
    </div>
  </a>

  <a href="/sourcing.html" class="mode-card sourcing" style="flex-basis: 100%;">
    <div class="mode-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <div class="mode-text">
      <div class="mode-label">Sourcing</div>
      <div class="mode-desc">Monitor · Score · Offer</div>
    </div>
  </a>
</div>

<div class="footer">Last Laugh Vintage · Long Beach</div>

<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});</script>
</body>
</html>
